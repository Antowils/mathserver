<!DOCTYPE html>
<html>
<head>
    <title>GST Bill Calculator</title>

    <style>

        body{
            background-color: #e37ed3;
            font-family: serif;
        }

        .container{
            width: 400px;
            background-color: white;
            padding: 30px;
            margin: 100px auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            text-align: center;
            color: rgb(8, 230, 241);
        }

        label{
            font-size: 18px;
            font-weight: bold;
        }

        input{
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid rgb(10, 244, 240);
        }

        .btn{
            text-align: center;
        }

        button{
            background-color: rgb(14, 195, 223);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background-color: rgb(14, 195, 223);
        }

        h3{
            color: rgb(14, 195, 223);
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>GST Bill Calculator</h2>

        <form method="POST">

            {% csrf_token %}

            <label>Enter Price :</label><br>

            <input type="number" 
                   name="price" 
                   value="{{price}}" 
                   step="0.01" 
                   required>

            <br><br>

            <label>Enter GST Percentage :</label><br>

            <input type="number" 
                   name="gst" 
                   value="{{gst}}" 
                   step="0.01" 
                   required>

            <div class="btn">
                <button type="submit">Calculate</button>
            </div>

        </form>

        {% if total_bill is not None %}

            <h3>Total Bill Amount : ₹ {{ total_bill }}</h3>

        {% endif %}

    </div>

</body>
</html>
